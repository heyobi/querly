name: Probe iPhone Duo unfold
on:
  push:
    branches: [duo-ipad]
    paths: ['.github/workflows/probe-duo.yml']
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - run: |
          DEV=$(xcrun simctl create probe-duo com.apple.CoreSimulator.SimDeviceType.iPhone-Duo com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$DEV"; sleep 25
          osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu bar item of menu bar 1' || echo "no accessibility"
          for m in Device Features I/O Window; do echo "== $m"; osascript -e "tell application \"System Events\" to tell process \"Simulator\" to get name of every menu item of menu 1 of menu bar item \"$m\" of menu bar 1" || true; done
          osascript -e 'tell application "System Events" to tell process "Simulator" to get name of every menu item of menu 1 of menu item "Posture" of menu 1 of menu bar item "Device" of menu bar 1' 2>&1 || true
          mkdir -p out
          for item in "Open" "Unfold" "Unfolded" "Flat" "Fully Open"; do
            for parent in "Device" "Features"; do
              osascript -e "tell application \"System Events\" to tell process \"Simulator\" to click menu item \"$item\" of menu 1 of menu bar item \"$parent\" of menu bar 1" 2>/dev/null && echo "clicked $parent > $item"
            done
          done
          sleep 10
          timeout 60 xcrun simctl io "$DEV" screenshot --display=3 out/inner.png || true
          xcrun simctl io "$DEV" screenshot --display=1 out/outer.png || true
          screencapture -x out/desktop.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-duo2, path: out/ }
