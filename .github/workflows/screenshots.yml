name: App Store screenshots

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: .cache/duckdb-ext
          key: duckdb-ext-${{ hashFiles('scripts/duckdb-assets.mjs') }}
      - name: Build the web app with the screenshot tour and sync into the iOS project
        run: VITE_SHOTS=1 npm run build && npx cap sync ios
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
      - name: iPhone 6.3" screenshots
        continue-on-error: true
        run: bash scripts/sim-shots.sh "iPhone 17 Pro" shots/iphone
      - name: iPad 13" screenshots
        continue-on-error: true
        run: bash scripts/sim-shots.sh "iPad Pro 13-inch (M5)" shots/ipad
      - name: iPhone Duo outer display screenshots
        continue-on-error: true
        run: bash scripts/sim-shots.sh "iPhone Duo" shots/duo-outer 1
      - name: iPhone Duo inner display screenshots
        continue-on-error: true
        run: bash scripts/sim-shots.sh "iPhone Duo" shots/duo-inner 3 unfold
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
